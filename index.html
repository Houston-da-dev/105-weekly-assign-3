    <body>
        <header>

            <button onclick="paper()">Paper</button>
            <button onclick="sissors()">Sissors</button>
        </section>
        <div id="UI">
            <div class="flexitem" id="player">
                <img src="" alt="">
            </div>
            <div class="flexitem">
                <h3>VS.</h3>

        </footer>
